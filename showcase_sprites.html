<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>CHROMAVORE — BESTIAIRE & SPRITE ATLAS</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: #080114;
      color: #00f0ff;
      font-family: monospace;
      padding: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    h1 {
      font-size: 26px;
      color: #ffd700;
      text-shadow: 0 0 16px #ffd700, 0 0 30px #ff007f;
      letter-spacing: 3px;
      margin-bottom: 8px;
      text-align: center;
    }
    .subtitle {
      color: #d946ef;
      font-size: 13px;
      letter-spacing: 2px;
      margin-bottom: 30px;
      text-shadow: 0 0 10px #d946ef;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 24px;
      width: 100%;
      max-width: 1100px;
    }
    .card {
      background: rgba(18, 5, 36, 0.9);
      border: 1.5px solid #331555;
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 0 20px rgba(0,0,0,0.6);
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .card:hover {
      border-color: #00f0ff;
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.3);
    }
    .card-title {
      font-size: 16px;
      font-weight: bold;
      letter-spacing: 2px;
      margin-bottom: 6px;
    }
    .card-role {
      font-size: 10.5px;
      color: #8899aa;
      margin-bottom: 16px;
      letter-spacing: 1px;
      text-align: center;
    }
    .preview-box {
      background: #04000a;
      border: 1px solid #220838;
      border-radius: 8px;
      padding: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      width: 100%;
      margin-bottom: 14px;
    }
    canvas {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 9.5px;
      font-weight: bold;
      letter-spacing: 1px;
      margin-top: 6px;
    }
    .desc {
      font-size: 11px;
      color: #aaccdd;
      line-height: 1.4;
      text-align: center;
    }
  </style>
</head>
<body>

<h1>⚡ CHROMAVORE : BESTIAIRE & SPRITES ATLAS ⚡</h1>
<div class="subtitle">VITRINE PIXEL ART NÉON MODERNE (ZOOM x4 & ANIMATIONS)</div>

<div class="grid" id="container"></div>

<script>
// Standalone SpriteAtlas definition for zero-dependency local viewing
class StandaloneSpriteAtlas {
  constructor() {
    this.ghostSprites = new Map();
    this.iconSprites = new Map();
    this.generateAllGhostSprites();
    this.generateAllIcons();
  }

  generateAllGhostSprites() {
    const archetypes = ['stalker', 'orbiter', 'rusher', 'phaser', 'titan', 'flee'];
    const directions = ['left', 'right', 'up', 'down'];
    for (const arch of archetypes) {
      for (const dir of directions) {
        for (let frame = 0; frame < 2; frame++) {
          const key = `${arch}_${dir}_${frame}`;
          this.ghostSprites.set(key, this.createGhostCanvas(arch, dir, frame));
        }
      }
    }
  }

  createGhostCanvas(type, dir, frame) {
    const size = 32;
    const c = document.createElement('canvas');
    c.width = size; c.height = size;
    const ctx = c.getContext('2d');
    const cx = size / 2, cy = size / 2;

    let ex = 0, ey = 0;
    if (dir === 'left') ex = -2;
    else if (dir === 'right') ex = 2;
    else if (dir === 'up') ey = -2;
    else if (dir === 'down') ey = 2;

    switch (type) {
      case 'stalker': this.drawStalkerSprite(ctx, cx, cy, ex, ey, frame); break;
      case 'orbiter': this.drawOrbiterSprite(ctx, cx, cy, ex, ey, frame); break;
      case 'rusher': this.drawRusherSprite(ctx, cx, cy, ex, ey, dir, frame); break;
      case 'phaser': this.drawPhaserSprite(ctx, cx, cy, ex, ey, frame); break;
      case 'titan': this.drawTitanSprite(ctx, cx, cy, ex, ey, frame); break;
      case 'flee': this.drawFleeSprite(ctx, cx, cy, frame); break;
    }
    return c;
  }

  drawStalkerSprite(ctx, cx, cy, ex, ey, frame) {
    ctx.fillStyle = '#ff0055';
    ctx.fillRect(cx - 9, cy - 11, 3, 4);
    ctx.fillRect(cx - 8, cy - 13, 2, 3);
    ctx.fillRect(cx + 6, cy - 11, 3, 4);
    ctx.fillRect(cx + 6, cy - 13, 2, 3);
    ctx.fillRect(cx - 7, cy - 8, 14, 10);
    ctx.fillRect(cx - 8, cy - 5, 16, 8);
    if (frame === 0) {
      ctx.fillRect(cx - 8, cy + 3, 3, 5); ctx.fillRect(cx - 3, cy + 3, 3, 4);
      ctx.fillRect(cx + 1, cy + 3, 3, 5); ctx.fillRect(cx + 5, cy + 3, 3, 4);
    } else {
      ctx.fillRect(cx - 8, cy + 3, 3, 4); ctx.fillRect(cx - 4, cy + 3, 3, 5);
      ctx.fillRect(cx, cy + 3, 3, 4); ctx.fillRect(cx + 5, cy + 3, 3, 5);
    }
    ctx.fillStyle = '#ff77aa';
    ctx.fillRect(cx - 8, cy - 12, 1, 2); ctx.fillRect(cx + 7, cy - 12, 1, 2);
    ctx.fillRect(cx - 5, cy - 7, 10, 2);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(cx - 6 + ex, cy - 4 + ey, 4, 4); ctx.fillRect(cx + 2 + ex, cy - 4 + ey, 4, 4);
    ctx.fillStyle = '#660022';
    ctx.fillRect(cx - 5 + ex, cy - 3 + ey, 2, 3); ctx.fillRect(cx + 3 + ex, cy - 3 + ey, 2, 3);
  }

  drawOrbiterSprite(ctx, cx, cy, ex, ey, frame) {
    ctx.fillStyle = '#00f0ff';
    ctx.fillRect(cx - 6, cy - 9, 12, 3); ctx.fillRect(cx - 8, cy - 6, 16, 9); ctx.fillRect(cx - 9, cy - 3, 18, 7);
    const orbitOff = frame === 0 ? 0 : 1;
    ctx.fillStyle = '#aaffff';
    ctx.fillRect(cx - 11, cy - 2 + orbitOff, 2, 3); ctx.fillRect(cx + 9, cy - 2 - orbitOff, 2, 3);
    ctx.fillStyle = '#00f0ff';
    if (frame === 0) {
      ctx.fillRect(cx - 8, cy + 4, 4, 4); ctx.fillRect(cx - 2, cy + 4, 4, 3); ctx.fillRect(cx + 4, cy + 4, 4, 4);
    } else {
      ctx.fillRect(cx - 8, cy + 4, 4, 3); ctx.fillRect(cx - 2, cy + 4, 4, 4); ctx.fillRect(cx + 4, cy + 4, 4, 3);
    }
    ctx.fillStyle = '#aaffff'; ctx.fillRect(cx - 4, cy - 8, 8, 2);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(cx - 6 + ex, cy - 3 + ey, 4, 4); ctx.fillRect(cx + 2 + ex, cy - 3 + ey, 4, 4);
    ctx.fillStyle = '#006688';
    ctx.fillRect(cx - 5 + ex, cy - 2 + ey, 2, 2); ctx.fillRect(cx + 3 + ex, cy - 2 + ey, 2, 2);
  }

  drawRusherSprite(ctx, cx, cy, ex, ey, dir, frame) {
    ctx.fillStyle = '#ff8800';
    ctx.fillRect(cx - 4, cy - 10, 8, 4); ctx.fillRect(cx - 7, cy - 6, 14, 6); ctx.fillRect(cx - 9, cy, 18, 5);
    ctx.fillRect(cx - 11, cy + 1, 3, 5); ctx.fillRect(cx + 8, cy + 1, 3, 5);
    const flk = frame === 0 ? 3 : 5;
    ctx.fillStyle = '#ffee00';
    ctx.fillRect(cx - 5, cy + 5, 3, flk); ctx.fillRect(cx + 2, cy + 5, 3, flk);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(cx - 4, cy + 5, 1, Math.max(1, flk - 2)); ctx.fillRect(cx + 3, cy + 5, 1, Math.max(1, flk - 2));
    ctx.fillRect(cx - 6 + ex, cy - 3 + ey, 5, 3); ctx.fillRect(cx + 1 + ex, cy - 3 + ey, 5, 3);
    ctx.fillStyle = '#aa3300';
    ctx.fillRect(cx - 4 + ex, cy - 3 + ey, 2, 3); ctx.fillRect(cx + 2 + ex, cy - 3 + ey, 2, 3);
  }

  drawPhaserSprite(ctx, cx, cy, ex, ey, frame) {
    ctx.fillStyle = '#b000ff';
    const gShift = frame === 0 ? 1 : -1;
    ctx.fillRect(cx - 7 + gShift, cy - 9, 13, 5); ctx.fillRect(cx - 9, cy - 4, 17, 8); ctx.fillRect(cx - 8 - gShift, cy + 2, 15, 4);
    ctx.fillStyle = '#e088ff';
    ctx.fillRect(cx - 11 + gShift * 2, cy - 3, 3, 2); ctx.fillRect(cx + 7 - gShift * 2, cy + 1, 3, 2); ctx.fillRect(cx - 5, cy - 8, 4, 1);
    ctx.fillStyle = '#b000ff';
    ctx.fillRect(cx - 8, cy + 6, 2, frame === 0 ? 4 : 2); ctx.fillRect(cx - 4, cy + 6, 3, frame === 0 ? 2 : 5);
    ctx.fillRect(cx + 1, cy + 6, 2, frame === 0 ? 5 : 3); ctx.fillRect(cx + 5, cy + 6, 3, frame === 0 ? 3 : 5);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(cx - 6 + ex, cy - 4 + ey, 3, 4); ctx.fillRect(cx + 2 + ex, cy - 3 + ey, 4, 3);
    ctx.fillStyle = '#440066';
    ctx.fillRect(cx - 5 + ex, cy - 3 + ey, 1, 3); ctx.fillRect(cx + 3 + ex, cy - 2 + ey, 2, 2);
  }

  drawTitanSprite(ctx, cx, cy, ex, ey, frame) {
    ctx.fillStyle = '#ff007f';
    ctx.fillRect(cx - 11, cy - 9, 22, 14); ctx.fillRect(cx - 9, cy - 12, 18, 5);
    ctx.fillStyle = '#ff88bb';
    ctx.fillRect(cx - 12, cy - 8, 3, 7); ctx.fillRect(cx + 9, cy - 8, 3, 7); ctx.fillRect(cx - 8, cy - 12, 16, 2);
    ctx.fillStyle = '#ff007f';
    const pulse = frame === 0 ? 0 : 1;
    ctx.fillRect(cx - 10, cy + 5, 4, 5 + pulse); ctx.fillRect(cx - 4, cy + 5, 4, 4 - pulse);
    ctx.fillRect(cx + 1, cy + 5, 4, 5 + pulse); ctx.fillRect(cx + 6, cy + 5, 4, 4 - pulse);
    ctx.fillStyle = '#330018';
    ctx.fillRect(cx - 7 + ex, cy - 5 + ey, 14, 7);
    ctx.fillStyle = '#ff0033';
    ctx.fillRect(cx - 6 + ex, cy - 4 + ey, 4, 3); ctx.fillRect(cx + 2 + ex, cy - 4 + ey, 4, 3);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(cx - 5 + ex, cy - 3 + ey, 2, 1); ctx.fillRect(cx + 3 + ex, cy - 3 + ey, 2, 1);
    ctx.fillStyle = '#ff88bb';
    ctx.fillRect(cx - 3 + ex, cy + 1 + ey, 6, 1);
  }

  drawFleeSprite(ctx, cx, cy, frame) {
    ctx.fillStyle = frame === 0 ? '#2563eb' : '#3b82f6';
    ctx.fillRect(cx - 6, cy - 7, 12, 11); ctx.fillRect(cx - 8, cy - 4, 16, 8);
    if (frame === 0) {
      ctx.fillRect(cx - 8, cy + 4, 3, 3); ctx.fillRect(cx - 3, cy + 4, 3, 4);
      ctx.fillRect(cx + 1, cy + 4, 3, 3); ctx.fillRect(cx + 5, cy + 4, 3, 4);
    } else {
      ctx.fillRect(cx - 8, cy + 4, 3, 4); ctx.fillRect(cx - 4, cy + 4, 3, 3);
      ctx.fillRect(cx, cy + 4, 3, 4); ctx.fillRect(cx + 5, cy + 4, 3, 3);
    }
    ctx.fillStyle = '#ffff00';
    ctx.fillRect(cx - 6, cy - 4, 4, 4); ctx.fillRect(cx + 2, cy - 4, 4, 4);
    ctx.fillStyle = '#ff0000';
    ctx.fillRect(cx - 5, cy - 3, 2, 2); ctx.fillRect(cx + 3, cy - 3, 2, 2);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(cx - 4, cy + 1, 2, 1); ctx.fillRect(cx - 2, cy + 2, 2, 1);
    ctx.fillRect(cx, cy + 1, 2, 1); ctx.fillRect(cx + 2, cy + 2, 2, 1);
  }

  generateAllIcons() {
    this.iconSprites.set('void_relic', this.createVoidRelicIcon());
    this.iconSprites.set('vortex_portal', this.createVortexPortalIcon());
    this.iconSprites.set('nova', this.createNovaIcon());
    this.iconSprites.set('dash', this.createDashIcon());
    this.iconSprites.set('cryo', this.createCryoIcon());
    this.iconSprites.set('laser', this.createLaserIcon());
    this.iconSprites.set('vortex_item', this.createBlackHoleIcon());
  }

  createVoidRelicIcon() {
    const c = document.createElement('canvas'); c.width = 32; c.height = 32;
    const ctx = c.getContext('2d'); const cx = 16, cy = 16;
    ctx.fillStyle = '#ff0055';
    ctx.fillRect(cx - 1, cy - 12, 2, 24); ctx.fillRect(cx - 12, cy - 1, 24, 2);
    ctx.fillRect(cx - 4, cy - 8, 8, 16); ctx.fillRect(cx - 8, cy - 4, 16, 8);
    ctx.fillStyle = '#0a0114'; ctx.fillRect(cx - 4, cy - 4, 8, 8);
    ctx.fillStyle = '#ffffff'; ctx.fillRect(cx - 1, cy - 1, 2, 2);
    return c;
  }

  createVortexPortalIcon() {
    const c = document.createElement('canvas'); c.width = 36; c.height = 36;
    const ctx = c.getContext('2d'); const cx = 18, cy = 18;
    ctx.fillStyle = '#00ffff';
    ctx.fillRect(cx - 10, cy - 8, 6, 3); ctx.fillRect(cx + 4, cy + 6, 6, 3);
    ctx.fillRect(cx - 8, cy + 4, 3, 6); ctx.fillRect(cx + 6, cy - 9, 3, 6);
    ctx.fillStyle = '#d946ef';
    ctx.fillRect(cx - 6, cy - 5, 12, 10); ctx.fillRect(cx - 4, cy - 7, 8, 14);
    ctx.fillStyle = '#060012'; ctx.fillRect(cx - 3, cy - 3, 6, 6);
    ctx.fillStyle = '#ffffff'; ctx.fillRect(cx - 1, cy - 1, 2, 2);
    return c;
  }

  createNovaIcon() {
    const c = document.createElement('canvas'); c.width = 32; c.height = 32;
    const ctx = c.getContext('2d'); const cx = 16, cy = 16;
    ctx.fillStyle = '#ffd700';
    ctx.fillRect(cx - 1, cy - 11, 2, 22); ctx.fillRect(cx - 11, cy - 1, 22, 2);
    ctx.fillRect(cx - 6, cy - 6, 3, 3); ctx.fillRect(cx + 3, cy - 6, 3, 3);
    ctx.fillRect(cx - 6, cy + 3, 3, 3); ctx.fillRect(cx + 3, cy + 3, 3, 3);
    ctx.fillStyle = '#ffffff'; ctx.fillRect(cx - 4, cy - 4, 8, 8);
    ctx.fillStyle = '#ffd700'; ctx.fillRect(cx - 2, cy - 2, 4, 4);
    ctx.fillStyle = '#ffffff'; ctx.fillRect(cx - 1, cy - 1, 2, 2);
    return c;
  }

  createDashIcon() {
    const c = document.createElement('canvas'); c.width = 32; c.height = 32;
    const ctx = c.getContext('2d'); const cx = 16, cy = 16;
    ctx.fillStyle = '#00ffff';
    ctx.fillRect(cx - 1, cy - 11, 4, 5); ctx.fillRect(cx - 4, cy - 7, 5, 4); ctx.fillRect(cx - 7, cy - 3, 5, 4);
    ctx.fillRect(cx - 8, cy, 14, 2);
    ctx.fillRect(cx + 1, cy + 1, 4, 4); ctx.fillRect(cx - 2, cy + 4, 4, 4); ctx.fillRect(cx - 5, cy + 7, 4, 4);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(cx - 2, cy - 6, 2, 3); ctx.fillRect(cx - 4, cy, 8, 1); ctx.fillRect(cx, cy + 2, 2, 3);
    return c;
  }

  createCryoIcon() {
    const c = document.createElement('canvas'); c.width = 32; c.height = 32;
    const ctx = c.getContext('2d'); const cx = 16, cy = 16;
    ctx.fillStyle = '#00ffcc';
    ctx.fillRect(cx - 1, cy - 10, 2, 20); ctx.fillRect(cx - 10, cy - 1, 20, 2);
    ctx.fillRect(cx - 6, cy - 6, 2, 2); ctx.fillRect(cx + 4, cy - 6, 2, 2);
    ctx.fillRect(cx - 6, cy + 4, 2, 2); ctx.fillRect(cx + 4, cy + 4, 2, 2);
    ctx.fillStyle = '#ffffff'; ctx.fillRect(cx - 3, cy - 3, 6, 6);
    ctx.fillStyle = '#00aacc'; ctx.fillRect(cx - 1, cy - 1, 2, 2);
    return c;
  }

  createLaserIcon() {
    const c = document.createElement('canvas'); c.width = 32; c.height = 32;
    const ctx = c.getContext('2d'); const cx = 16, cy = 16;
    ctx.fillStyle = '#ff0055';
    ctx.fillRect(cx - 9, cy - 5, 18, 2); ctx.fillRect(cx - 11, cy - 1, 22, 2); ctx.fillRect(cx - 9, cy + 3, 18, 2);
    ctx.fillStyle = '#ffffff'; ctx.fillRect(cx - 6, cy - 1, 12, 2);
    return c;
  }

  createBlackHoleIcon() {
    const c = document.createElement('canvas'); c.width = 32; c.height = 32;
    const ctx = c.getContext('2d'); const cx = 16, cy = 16;
    ctx.fillStyle = '#b000ff';
    ctx.fillRect(cx - 10, cy - 4, 20, 8); ctx.fillRect(cx - 8, cy - 7, 16, 14);
    ctx.fillStyle = '#050012'; ctx.fillRect(cx - 5, cy - 5, 10, 10);
    ctx.fillStyle = '#00ffff'; ctx.fillRect(cx - 7, cy - 1, 14, 2);
    return c;
  }

  drawGhost(ctx, type, isFlee, dx, dy, time, x, y, size, isTitan) {
    let dir = 'down';
    if (Math.abs(dx) > Math.abs(dy)) dir = dx > 0 ? 'right' : 'left';
    else dir = dy < 0 ? 'up' : 'down';
    let arch = isFlee ? 'flee' : isTitan ? 'titan' : type;
    const frame = ((time * 6) | 0) & 1;
    const key = `${arch}_${dir}_${frame}`;
    const sprite = this.ghostSprites.get(key) || this.ghostSprites.get(`${arch}_down_0`);
    if (sprite) {
      const renderSize = isTitan ? size * 1.35 : size;
      ctx.drawImage(sprite, 0, 0, 32, 32, Math.round(x - renderSize / 2), Math.round(y - renderSize / 2), Math.round(renderSize), Math.round(renderSize));
    }
  }

  drawIcon(ctx, iconId, x, y, size) {
    const icon = this.iconSprites.get(iconId);
    if (icon) {
      ctx.drawImage(icon, 0, 0, icon.width, icon.height, Math.round(x - size / 2), Math.round(y - size / 2), Math.round(size), Math.round(size));
    }
  }
}

const spriteAtlas = new StandaloneSpriteAtlas();

const entities = [
  {
    type: 'stalker',
    name: 'STALKER (LE TRAQUEUR)',
    color: '#ff0055',
    role: 'Chasseur direct & agressif',
    desc: 'Cornes néon prédatrices acérées, silhouette anguleuse et regard traqueur perçant.'
  },
  {
    type: 'rusher',
    name: 'RUSHER (LE FONCEUR)',
    color: '#ff8800',
    role: 'Intercepteur supersonique',
    desc: 'Profil effilé en flèche aérodynamique, ailerons latéraux et réacteurs de propulsion arrières.'
  },
  {
    type: 'orbiter',
    name: 'ORBITER (LE RÔDEUR)',
    color: '#00f0ff',
    role: 'Flâneur circulaire d’encerclement',
    desc: 'Silhouette hydrodynamique arrondie, anneaux d’énergie orbitaux et ondulations douces.'
  },
  {
    type: 'phaser',
    name: 'PHASER (LE SPECTRE)',
    color: '#b000ff',
    role: 'Embusqué spectral & imprévisible',
    desc: 'Silhouette brisée asymétrique, déphasage spectral instable et découpes glitchées.'
  },
  {
    type: 'titan',
    name: 'TITAN (LE COLOSSE BLINDÉ)',
    color: '#ff007f',
    isTitan: true,
    role: 'Menace colossale de fin de wave',
    desc: 'Carrure massive (1.35x), épaulières blindées en plaques néon et masque de cyber-skull menaçant.'
  },
  {
    type: 'flee',
    name: 'FLEE (EN FUITE / VULNÉRABLE)',
    color: '#2563eb',
    isFlee: true,
    role: 'Proie terrifiée après Mega-Pellet',
    desc: 'Silhouette recroquevillée et tremblante, grands yeux exorbités et bouche en zig-zag de panique.'
  }
];

const icons = [
  { id: 'void_relic', name: 'RELIQUE DU VIDE', color: '#ff0055', desc: 'Artefact géométrique obscur cerclé de pointes diamant néon.' },
  { id: 'vortex_portal', name: 'PORTAIL VORTEX', color: '#d946ef', desc: 'Singularité cosmique spiralée cyan & magenta à bras d’accrétion.' },
  { id: 'nova', name: 'MEGA NOVA', color: '#ffd700', desc: 'Étoile stellaire explosive à 8 pointes d’or incandescent.' },
  { id: 'dash', name: 'CYBER DASH / OVERDRIVE', color: '#00ffff', desc: 'Double éclair cybernétique à biseau haute tension.' },
  { id: 'cryo', name: 'CRYO FROST', color: '#00ffcc', desc: 'Cristal hexagonal de givre cryogénique.' },
  { id: 'vortex_item', name: 'BLACK HOLE', color: '#b000ff', desc: 'Puits gravitationnel sombre à anneau de plasma.' }
];

const container = document.getElementById('container');

// Render entities
for (const ent of entities) {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <div class="card-title" style="color: ${ent.color}">${ent.name}</div>
    <div class="card-role">${ent.role}</div>
    <div class="preview-box">
      <canvas id="cv_${ent.type}" width="180" height="90"></canvas>
    </div>
    <div class="desc">${ent.desc}</div>
    <div class="badge" style="background: ${ent.color}22; color: ${ent.color}; border: 1px solid ${ent.color}66;">
      SILHOUETTE PROPRE
    </div>
  `;
  container.appendChild(card);
}

// Render icons section
const iconCard = document.createElement('div');
iconCard.className = 'card';
iconCard.style.gridColumn = '1 / -1';
iconCard.innerHTML = `
  <div class="card-title" style="color: #ffd700">ICÔNES D’OBJETS & RELIQUES PIXEL ART (REMPLACEMENT DES EMOJIS)</div>
  <div class="card-role">Reliques & Super-Items dessinés au pixel près</div>
  <div class="preview-box" style="gap: 28px; flex-wrap: wrap;">
    <canvas id="cv_icons" width="800" height="90"></canvas>
  </div>
`;
container.appendChild(iconCard);

let time = 0;
function animate() {
  time += 0.016;

  // Animate ghosts
  for (const ent of entities) {
    const cv = document.getElementById(`cv_${ent.type}`);
    if (!cv) continue;
    const ctx = cv.getContext('2d');
    ctx.clearRect(0, 0, cv.width, cv.height);

    const dirs = ['left', 'down', 'right'];
    const scale = ent.isTitan ? 48 : 38;

    dirs.forEach((dir, idx) => {
      const x = 32 + idx * 58;
      const y = cv.height / 2;
      let dx = 0, dy = 0;
      if (dir === 'left') dx = -1;
      else if (dir === 'right') dx = 1;
      else dy = 1;

      // Draw ambient glow
      ctx.save();
      ctx.fillStyle = ent.color;
      ctx.shadowColor = ent.color;
      ctx.shadowBlur = 16;
      ctx.globalAlpha = 0.25;
      ctx.beginPath();
      ctx.arc(x, y, scale * 0.45, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // Draw sprite
      spriteAtlas.drawGhost(
        ctx,
        ent.type,
        !!ent.isFlee,
        dx,
        dy,
        time,
        x,
        y,
        scale,
        !!ent.isTitan
      );
    });
  }

  // Draw icons
  const cvIcons = document.getElementById('cv_icons');
  if (cvIcons) {
    const ctx = cvIcons.getContext('2d');
    ctx.clearRect(0, 0, cvIcons.width, cvIcons.height);

    icons.forEach((ic, idx) => {
      const x = 50 + idx * 120;
      const y = 35;
      const pulse = 1 + Math.sin(time * 4 + idx) * 0.1;
      const sz = 34 * pulse;

      // Glow
      ctx.save();
      ctx.fillStyle = ic.color;
      ctx.shadowColor = ic.color;
      ctx.shadowBlur = 14;
      ctx.globalAlpha = 0.2;
      ctx.beginPath();
      ctx.arc(x, y, 22, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      spriteAtlas.drawIcon(ctx, ic.id, x, y, sz);

      ctx.font = 'bold 9px monospace';
      ctx.fillStyle = ic.color;
      ctx.textAlign = 'center';
      ctx.fillText(ic.name, x, y + 36);
    });
  }

  requestAnimationFrame(animate);
}

animate();
</script>
</body>
</html>
