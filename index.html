<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#05050a">
<title>CHROMAVORE</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{
  width:100%;height:100%;height:100dvh;overflow:hidden;
  background:#05050a;touch-action:none;user-select:none;
  -webkit-user-select:none;overscroll-behavior:none;
}
body{
  display:flex;justify-content:center;align-items:center;
  font-family:monospace;background:#05050a;
}
#game-wrap{
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  width:100vw;height:100vh;height:100dvh;position:fixed;inset:0;
  overflow:hidden;background:radial-gradient(circle at center,#090e1c 0%,#05050a 100%);
  padding:env(safe-area-inset-top, 4px) env(safe-area-inset-right, 4px) env(safe-area-inset-bottom, 4px) env(safe-area-inset-left, 4px);
}
canvas{
  display:block;border-radius:6px;
  box-shadow:0 0 25px rgba(0,0,0,0.9), 0 0 10px rgba(0,180,255,0.15);
  max-width:100vw;object-fit:contain;flex-shrink:0;
}

/* Mobile Touch Deck */
#touch-deck{
  display:none;
  width:100%;
  max-width:520px;
  height:135px;
  justify-content:space-between;
  align-items:center;
  padding:4px 14px env(safe-area-inset-bottom, 6px);
  box-sizing:border-box;
  z-index:20;
  flex-shrink:0;
}
#touch-deck.active{
  display:flex;
}

.dpad{position:relative;width:120px;height:120px}
.dbtn{
  position:absolute;width:38px;height:38px;background:#0d1527;border:2px solid #00b4ff;
  border-radius:10px;color:#00ffff;font-size:15px;font-weight:bold;
  display:flex;justify-content:center;align-items:center;touch-action:none;
  box-shadow:0 0 8px rgba(0,180,255,0.25);outline:none;-webkit-tap-highlight-color:transparent;
  transition:background 0.08s, transform 0.08s, box-shadow 0.08s;
}
.dbtn:active,.dbtn.pressed{background:#00e5ff;color:#050a14;transform:scale(0.92);box-shadow:0 0 16px #00ffff}
.d-up{top:0;left:41px}
.d-down{bottom:0;left:41px}
.d-left{top:41px;left:0}
.d-right{top:41px;right:0}
.d-center{top:41px;left:41px;background:#090d16;border:1px solid #16243e;border-radius:6px;pointer-events:none}

.util-btns{display:flex;flex-direction:column;gap:8px;align-items:center}
.ubtn{
  background:#111624;border:1px solid #334466;border-radius:8px;color:#8899bb;
  font-size:9px;padding:6px 10px;font-weight:bold;touch-action:none;font-family:monospace;
  outline:none;-webkit-tap-highlight-color:transparent;
}
.ubtn:active{background:#223355;color:#fff;border-color:#00b4ff}

.action-btns{display:flex;align-items:center;gap:10px}
.dash-wrap{display:flex;flex-direction:column;align-items:center;gap:3px}
#item-btn{
  width:52px;height:52px;border-radius:50%;background:radial-gradient(circle,#441166 0%,#1a0628 100%);
  border:2px solid #bb44ff;color:#fff;font-size:10px;font-weight:bold;
  display:none;flex-direction:column;justify-content:center;align-items:center;
  box-shadow:0 0 14px rgba(187,68,255,0.4);touch-action:none;outline:none;
  -webkit-tap-highlight-color:transparent;font-family:monospace;
  transition:transform 0.08s, box-shadow 0.08s;
}
#item-btn.ready{
  display:flex;
  animation:itemPulse 0.9s infinite alternate;
}
@keyframes itemPulse{
  0%{box-shadow:0 0 10px #bb44ff;border-color:#bb44ff}
  100%{box-shadow:0 0 25px #ff44ff,0 0 12px #ffff00;border-color:#ffffff}
}
#item-btn:active{transform:scale(0.92);background:#ff44ff;color:#050a14}
#item-label{font-size:8px;color:#ffaa00;letter-spacing:1px;font-weight:bold}

#dash-btn{
  width:62px;height:62px;border-radius:50%;background:radial-gradient(circle,#004d66 0%,#0c1626 100%);
  border:3px solid #00ffff;color:#fff;font-size:11px;font-weight:bold;
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  box-shadow:0 0 14px rgba(0,255,255,0.4);touch-action:none;outline:none;
  -webkit-tap-highlight-color:transparent;font-family:monospace;
  transition:transform 0.08s, box-shadow 0.08s;
}
#dash-btn:active,#dash-btn.active-press{transform:scale(0.92);background:#00ffff;color:#050a14;box-shadow:0 0 22px #00ffff}
#dash-btn.cooling{border-color:#334455;box-shadow:none;opacity:0.6}
#dash-label{font-size:8px;color:#00ffff;letter-spacing:1px;font-weight:bold}

/* Mobile Landscape Overlay */
@media (orientation: landscape) and (max-height: 520px) {
  #touch-deck.active{
    position:absolute;inset:0;width:100%;max-width:100%;height:100%;
    pointer-events:none;padding:10px 24px env(safe-area-inset-bottom, 10px);
    justify-content:space-between;align-items:flex-end;
  }
  #touch-deck .dpad,#touch-deck .action-btns,#touch-deck .util-btns{pointer-events:auto}
  .util-btns{
    position:absolute;top:10px;right:18px;flex-direction:row;gap:8px;
  }
  .ubtn{font-size:9px;padding:4px 8px;background:rgba(17,22,36,0.85);backdrop-filter:blur(4px)}
  .dpad{width:105px;height:105px;margin-bottom:6px}
  .dbtn{width:34px;height:34px;font-size:13px;background:rgba(13,21,39,0.85);backdrop-filter:blur(4px)}
  .d-up{top:0;left:35px}
  .d-down{bottom:0;left:35px}
  .d-left{top:35px;left:0}
  .d-right{top:35px;right:0}
  .d-center{top:35px;left:35px}
  .action-btns{margin-bottom:6px}
  #dash-btn{width:56px;height:56px;background:radial-gradient(circle,rgba(0,77,102,0.9) 0%,rgba(12,22,38,0.9) 100%)}
  #item-btn{width:48px;height:48px}
}
</style>
</head>
<body>
<div id="game-wrap">
  <canvas id="c"></canvas>
  <div id="touch-deck">
    <div class="dpad">
      <button class="dbtn d-up" id="btn-up" aria-label="Up">▲</button>
      <button class="dbtn d-left" id="btn-left" aria-label="Left">◄</button>
      <div class="dbtn d-center"></div>
      <button class="dbtn d-right" id="btn-right" aria-label="Right">►</button>
      <button class="dbtn d-down" id="btn-down" aria-label="Down">▼</button>
    </div>
    <div class="util-btns">
      <button class="ubtn" id="btn-pause">⏸ PAUSE</button>
      <button class="ubtn" id="btn-mute">🔊 AUDIO</button>
    </div>
    <div class="action-btns">
      <div class="dash-wrap">
        <button id="item-btn" aria-label="Item">
          <span style="font-size:18px" id="item-txt">💣</span>
          <span style="font-size:9px">ITEM</span>
        </button>
        <span id="item-label"></span>
      </div>
      <div class="dash-wrap">
        <button id="dash-btn" aria-label="Dash">
          <span style="font-size:20px">⚡</span>
          <span style="font-size:10px">DASH</span>
        </button>
        <span id="dash-label">READY</span>
      </div>
    </div>
  </div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
