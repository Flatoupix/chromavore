<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#090117">
<title>CHROMAVORE // SYNTHWAVE 1984</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{
  width:100%;height:100%;height:100dvh;overflow:hidden;
  background:#080114;touch-action:none;user-select:none;
  -webkit-user-select:none;overscroll-behavior:none;
}
body{
  display:flex;justify-content:center;align-items:center;
  font-family:monospace;background:#080114;
}
#game-wrap{
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  width:100vw;height:100vh;height:100dvh;position:fixed;inset:0;
  overflow:hidden;background:radial-gradient(circle at 50% 100%, #300045 0%, #150028 45%, #080114 100%);
  padding:env(safe-area-inset-top, 4px) env(safe-area-inset-right, 4px) env(safe-area-inset-bottom, 4px) env(safe-area-inset-left, 4px);
}
canvas{
  display:block;border-radius:6px;
  box-shadow:0 0 35px rgba(255, 0, 127, 0.28), 0 0 15px rgba(0, 240, 255, 0.22);
  max-width:100%;max-height:100%;
  width:auto;height:auto;
  object-fit:contain;flex-shrink:1;
}

/* Mobile Touch Deck */
#touch-deck{
  display:none;
  width:100%;
  max-width:520px;
  height:135px;
  justify-content:space-between;
  align-items:center;
  padding:4px 14px env(safe-area-inset-bottom, 6px);
  box-sizing:border-box;
  z-index:20;
  flex-shrink:0;
}
#touch-deck.active{
  display:flex;
}

.dpad{position:relative;width:120px;height:120px}
.dbtn{
  position:absolute;width:38px;height:38px;background:#18052e;border:2px solid #ff007f;
  border-radius:10px;color:#00f0ff;font-size:15px;font-weight:bold;
  display:flex;justify-content:center;align-items:center;touch-action:none;
  box-shadow:0 0 10px rgba(255, 0, 127, 0.35);outline:none;-webkit-tap-highlight-color:transparent;
  transition:background 0.08s, transform 0.08s, box-shadow 0.08s;
}
.dbtn:active,.dbtn.pressed{background:#ff007f;color:#ffffff;transform:scale(0.92);box-shadow:0 0 20px #ff007f}
.d-up{top:0;left:41px}
.d-down{bottom:0;left:41px}
.d-left{top:41px;left:0}
.d-right{top:41px;right:0}
.d-center{top:41px;left:41px;background:#120324;border:1px solid #3d0a48;border-radius:6px;pointer-events:none}

.util-btns{display:flex;flex-direction:column;gap:8px;align-items:center}
.ubtn{
  background:#1a082e;border:1px solid #ff007f;border-radius:8px;color:#00f0ff;
  font-size:9px;padding:6px 10px;font-weight:bold;touch-action:none;font-family:monospace;
  outline:none;-webkit-tap-highlight-color:transparent;
  box-shadow:0 0 8px rgba(255, 0, 127, 0.25);
}
.ubtn:active{background:#ff007f;color:#fff;border-color:#00f0ff}

.action-btns{display:flex;align-items:center;gap:10px}
.dash-wrap{display:flex;flex-direction:column;align-items:center;gap:3px}
#item-btn{
  width:52px;height:52px;border-radius:50%;background:radial-gradient(circle,#550066 0%,#150028 100%);
  border:2px solid #ff007f;color:#fff;font-size:10px;font-weight:bold;
  display:none;flex-direction:column;justify-content:center;align-items:center;
  box-shadow:0 0 14px rgba(255, 0, 127, 0.4);touch-action:none;outline:none;
  -webkit-tap-highlight-color:transparent;font-family:monospace;
  transition:transform 0.08s, box-shadow 0.08s;
}
#item-btn.ready{
  display:flex;
  animation:itemPulse 0.9s infinite alternate;
}
@keyframes itemPulse{
  0%{box-shadow:0 0 10px #ff007f;border-color:#ff007f}
  100%{box-shadow:0 0 25px #00f0ff,0 0 12px #ffe600;border-color:#ffffff}
}
#item-btn:active{transform:scale(0.92);background:#ff007f;color:#ffffff}
#item-label{font-size:8px;color:#ffd700;letter-spacing:1px;font-weight:bold}

#dash-btn{
  width:62px;height:62px;border-radius:50%;background:radial-gradient(circle,#5a0044 0%,#1a0028 100%);
  border:3px solid #00f0ff;color:#fff;font-size:11px;font-weight:bold;
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  box-shadow:0 0 16px rgba(0, 240, 255, 0.45);touch-action:none;outline:none;
  -webkit-tap-highlight-color:transparent;font-family:monospace;
  transition:transform 0.08s, box-shadow 0.08s;
}
#dash-btn:active,#dash-btn.active-press{transform:scale(0.92);background:#00f0ff;color:#080114;box-shadow:0 0 25px #00f0ff}
#dash-btn.cooling{border-color:#3d1a3a;box-shadow:none;opacity:0.6}
#dash-label{font-size:8px;color:#00f0ff;letter-spacing:1px;font-weight:bold}

/* Mobile Landscape Overlay */
@media (orientation: landscape) and (max-height: 520px) {
  #touch-deck.active{
    position:absolute;inset:0;width:100%;max-width:100%;height:100%;
    pointer-events:none;padding:10px 24px env(safe-area-inset-bottom, 10px);
    justify-content:space-between;align-items:flex-end;
  }
  #touch-deck .dpad,#touch-deck .action-btns,#touch-deck .util-btns{pointer-events:auto}
  .util-btns{
    position:absolute;top:10px;right:18px;flex-direction:row;gap:8px;
  }
  .ubtn{font-size:9px;padding:4px 8px;background:rgba(17,22,36,0.85);backdrop-filter:blur(4px)}
  .dpad{width:105px;height:105px;margin-bottom:6px}
  .dbtn{width:34px;height:34px;font-size:13px;background:rgba(13,21,39,0.85);backdrop-filter:blur(4px)}
  .d-up{top:0;left:35px}
  .d-down{bottom:0;left:35px}
  .d-left{top:35px;left:0}
  .d-right{top:35px;right:0}
  .d-center{top:35px;left:35px}
  .action-btns{margin-bottom:6px}
  #dash-btn{width:56px;height:56px;background:radial-gradient(circle,rgba(0,77,102,0.9) 0%,rgba(12,22,38,0.9) 100%)}
  #item-btn{width:48px;height:48px}
}

/* Ensure touch deck is strictly hidden on desktop */
@media (min-width: 1025px), (hover: hover) and (pointer: fine) and (min-width: 768px) {
  #touch-deck {
    display: none !important;
  }
}
</style>
</head>
<body>
<div id="game-wrap">
  <canvas id="c"></canvas>

  <!-- Name input modal for leaderboard -->
  <div id="name-modal" style="
    display:none;position:fixed;inset:0;z-index:100;
    background:rgba(5,1,20,0.92);
    display:none;justify-content:center;align-items:center;
    font-family:monospace;
  ">
    <div style="
      background:#0a0d1e;border:2px solid #ff007f;border-radius:12px;
      padding:36px 40px;max-width:360px;width:90%;text-align:center;
      box-shadow:0 0 40px rgba(255,0,127,0.4),0 0 20px rgba(0,240,255,0.2);
    ">
      <div style="font-size:28px;margin-bottom:8px;">🏆</div>
      <div id="name-modal-title" style="
        color:#00f0ff;font-size:14px;font-weight:bold;
        letter-spacing:2px;margin-bottom:6px;
      ">SCORE ENREGISTRÉ !</div>
      <div id="name-modal-score" style="
        color:#ffd700;font-size:18px;font-weight:bold;margin-bottom:20px;
      "></div>
      <div style="color:#8899bb;font-size:11px;margin-bottom:10px;letter-spacing:1px;">
        ENTREZ VOTRE PSEUDO
      </div>
      <input id="pseudo-input" type="text" maxlength="12" autocomplete="off"
        placeholder="PLAYER1"
        style="
          background:#0c1830;border:2px solid #00f0ff;border-radius:6px;
          color:#fff;font-family:monospace;font-size:16px;font-weight:bold;
          padding:10px 14px;width:100%;text-align:center;
          outline:none;letter-spacing:2px;text-transform:uppercase;
          box-shadow:0 0 12px rgba(0,240,255,0.3);
        "
      />
      <button id="pseudo-submit" style="
        margin-top:16px;width:100%;padding:12px;
        background:linear-gradient(135deg,#ff007f,#7700cc);
        border:none;border-radius:8px;color:#fff;
        font-family:monospace;font-size:13px;font-weight:bold;
        letter-spacing:2px;cursor:pointer;
        box-shadow:0 0 18px rgba(255,0,127,0.5);
        transition:transform 0.1s,box-shadow 0.1s;
      ">✓ VALIDER</button>
      <button id="pseudo-skip" style="
        margin-top:8px;width:100%;padding:8px;
        background:transparent;border:1px solid #334466;
        border-radius:8px;color:#667799;
        font-family:monospace;font-size:11px;cursor:pointer;
        letter-spacing:1px;
      ">PASSER SANS ENREGISTRER</button>
    </div>
  </div>
  <div id="touch-deck">
    <div class="dpad">
      <button class="dbtn d-up" id="btn-up" aria-label="Up">▲</button>
      <button class="dbtn d-left" id="btn-left" aria-label="Left">◄</button>
      <div class="dbtn d-center"></div>
      <button class="dbtn d-right" id="btn-right" aria-label="Right">►</button>
      <button class="dbtn d-down" id="btn-down" aria-label="Down">▼</button>
    </div>
    <div class="util-btns">
      <button class="ubtn" id="btn-pause">⏸ PAUSE</button>
      <button class="ubtn" id="btn-mute">🔊 AUDIO</button>
    </div>
    <div class="action-btns">
      <div class="dash-wrap">
        <button id="item-btn" aria-label="Item">
          <span style="font-size:18px" id="item-txt">💣</span>
          <span style="font-size:9px">ITEM</span>
        </button>
        <span id="item-label"></span>
      </div>
      <div class="dash-wrap">
        <button id="dash-btn" aria-label="Dash">
          <span style="font-size:20px">⚡</span>
          <span style="font-size:10px">DASH</span>
        </button>
        <span id="dash-label">READY</span>
      </div>
    </div>
  </div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
